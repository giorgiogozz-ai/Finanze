<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Finanze">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Tracker</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#dde3ea;--ac:#1f6feb;--ok:#13804a;--ko:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mut:#93a0b1;--bd:#2c3644;--ac:#5b9dff;--ok:#43c783;--ko:#ff7b6b}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mut:#93a0b1;--bd:#2c3644;--ac:#5b9dff;--ok:#43c783;--ko:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;font-size:15px}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.kpi small{color:var(--mut);display:block;font-size:12px}
.kpi b{font-size:17px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,button{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;font-weight:bold;cursor:pointer;margin-top:12px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 button,.row3 button{margin-top:0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row3 button{font-size:13px;padding:11px 4px}
.cat{margin:8px 0}.ch{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar div{height:100%;background:var(--ac)}
.tx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}
.tx small{color:var(--mut);display:block}
.amt{font-weight:bold;white-space:nowrap}
.Entrata .amt{color:var(--ok)}.Spesa .amt{color:var(--ko)}
.del{width:auto;padding:2px 8px;margin:0 0 0 6px;background:transparent;color:var(--mut);border:1px solid var(--bd)}
#msg{font-size:12px;color:var(--mut);margin:6px 2px}
.lg{font-size:12px;color:var(--mut);margin:4px 0 8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px}.lg i:first-child{margin-left:0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:normal;font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--ko)}
</style>
</head>
<body>
<main>
<h1>Finance Tracker</h1>
<div class="kpi">
<div><small>Liquidità conto</small><b id="kLiq">–</b></div>
<div><small>Patrimonio totale</small><b id="kTot">–</b></div>
<div><small>Investito totale</small><b id="kInv">–</b></div>
<div><small>Casa accantonata</small><b id="kCasa">–</b></div>
<div><small>Entrate (mese)</small><b id="kIn">–</b></div>
<div><small>Spese (mese)</small><b id="kOut">–</b></div>
</div>
<div class="card" style="margin-top:12px">
<div class="row3">
<button type="button" id="qPac">+ PAC 200 €</button>
<button type="button" id="qCasa">+ Casa 100 €</button>
<button type="button" id="qInv">+ Investimento</button>
</div>
</div>
<div class="card">
<label for="fData">Data</label><input type="date" id="fData">
<label for="fTipo">Tipo</label>
<select id="fTipo"><option>Spesa</option><option>Entrata</option><option>Investimento</option><option>Casa</option></select>
<label for="fCat">Categoria</label><select id="fCat"></select>
<label for="fDesc">Descrizione</label><input type="text" id="fDesc" placeholder="Es. spesa al supermercato">
<label for="fImp">Importo (€)</label><input type="number" id="fImp" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
<button type="button" id="fAdd">Aggiungi movimento</button>
</div>
<div class="card">
<b>Andamento ultimi 6 mesi</b>
<div class="lg"><i style="background:var(--ok)"></i>Entrate<i style="background:var(--ko)"></i>Spese</div>
<div id="chBars"></div>
<b style="display:block;margin-top:14px">Risparmio accumulato</b>
<div class="lg">Entrate − spese − investimenti − casa, sommato mese dopo mese</div>
<div id="chLine"></div>
<div id="chTab"></div>
</div>
<div class="card">
<b>Spese per categoria (mese corrente)</b>
<div id="chCat"></div>
</div>
<div class="card">
<b>Ultimi movimenti</b>
<div id="list"></div>
<button type="button" class="sec" id="exp">Scarica per Excel (CSV)</button>
</div>
<div id="msg"></div>
<button type="button" class="sec" id="bReset" style="color:var(--ko);border-color:var(--ko)">Azzera tutti i dati</button>
<button type="button" class="sec" id="bSync" style="display:none">Sincronizza con Google Foglio</button>
</main>
<script>
var CFG={capitale:12000,pac:200,casa:100,liquidita:3385,liqTs:1794909557050};
var CATS={Spesa:["Alimentari","Trasporti","Bollette","Svago","Salute","Altro"],Entrata:["Stipendio","Altro"],Investimento:["PAC","Altro investimento"],Casa:["Accantonamento casa"]};
var items=[],col=null,KEY="fin_tx_v1";
var $=function(i){return document.getElementById(i)};
function eur(n){return n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function say(t){$("msg").textContent=t}
function fillCats(){var s=$("fCat");s.innerHTML="";CATS[$("fTipo").value].forEach(function(c){var o=document.createElement("option");o.textContent=c;s.appendChild(o)})}
function render(){
  var m=today().slice(0,7),inv=CFG.capitale,casa=0,en=0,sp=0,liq=CFG.liquidita;
  items.forEach(function(x){
    if(x.ts&&x.ts>CFG.liqTs)liq+=x.tipo==="Entrata"?x.importo:-x.importo;
    if(x.tipo==="Investimento")inv+=x.importo;
    if(x.tipo==="Casa")casa+=x.importo;
    if(x.data.slice(0,7)===m){if(x.tipo==="Entrata")en+=x.importo;if(x.tipo==="Spesa")sp+=x.importo}
  });
  $("kInv").textContent=eur(inv);$("kLiq").textContent=eur(liq);$("kTot").textContent=eur(liq+inv+casa);$("kCasa").textContent=eur(casa);$("kIn").textContent=eur(en);$("kOut").textContent=eur(sp);
  charts();
  var L=$("list");L.innerHTML="";
  var s=items.slice().sort(function(a,b){return b.data<a.data?-1:b.data>a.data?1:0}).slice(0,30);
  if(!s.length){L.textContent="Nessun movimento ancora.";L.style.color="var(--mut)";L.style.padding="8px 0"}
  s.forEach(function(x){
    var r=document.createElement("div");r.className="tx "+x.tipo;
    var a=document.createElement("div");var t=document.createElement("span");t.textContent=x.categoria+(x.descrizione?" – "+x.descrizione:"");
    var sm=document.createElement("small");sm.textContent=x.data.split("-").reverse().join("/")+" · "+x.tipo;a.appendChild(t);a.appendChild(sm);
    var b=document.createElement("div");var am=document.createElement("span");am.className="amt";am.textContent=eur(x.importo);
    var d=document.createElement("button");d.className="del";d.textContent="×";d.setAttribute("aria-label","Elimina");d.onclick=function(){remove(x)};
    b.style.display="flex";b.style.alignItems="center";b.appendChild(am);b.appendChild(d);
    r.appendChild(a);r.appendChild(b);L.appendChild(r)
  });
}
var MN=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function f0(n){return Math.round(n).toLocaleString("it-IT")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function charts(){
  var d=new Date(),ks=[],lb=[],i;
  for(i=5;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);ks.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"));lb.push(MN[x.getMonth()]+" "+String(x.getFullYear()).slice(2))}
  var ag={},pre=0;ks.forEach(function(k){ag[k]={en:0,sp:0,inv:0,casa:0}});
  items.forEach(function(t){
    var k=t.data.slice(0,7),sg=t.tipo==="Entrata"?t.importo:-t.importo;
    if(k<ks[0]){pre+=sg;return}
    var a=ag[k];if(!a)return;
    if(t.tipo==="Entrata")a.en+=t.importo;else if(t.tipo==="Spesa")a.sp+=t.importo;else if(t.tipo==="Investimento")a.inv+=t.importo;else a.casa+=t.importo;
  });
  var net=[],cum=[],run=pre,mx=1;
  ks.forEach(function(k){var a=ag[k],n=a.en-a.sp-a.inv-a.casa;run+=n;net.push(n);cum.push(run);mx=Math.max(mx,a.en,a.sp)});
  var gw=280/6,s='<svg viewBox="0 0 320 150" width="100%" role="img" aria-label="Entrate e spese per mese"><line x1="34" y1="120" x2="314" y2="120" stroke="var(--bd)"/><text x="2" y="16" font-size="9" fill="var(--mut)">'+f0(mx)+'</text><text x="2" y="120" font-size="9" fill="var(--mut)">0</text>';
  ks.forEach(function(k,j){
    var a=ag[k],x0=34+j*gw+gw/2-15,h1=a.en/mx*100,h2=a.sp/mx*100;
    s+='<rect x="'+x0+'" y="'+(120-h1)+'" width="14" height="'+h1+'" rx="2" style="fill:var(--ok)"/><rect x="'+(x0+16)+'" y="'+(120-h2)+'" width="14" height="'+h2+'" rx="2" style="fill:var(--ko)"/><text x="'+(x0+15)+'" y="135" font-size="9" text-anchor="middle" fill="var(--mut)">'+lb[j]+'</text>';
  });
  $("chBars").innerHTML=s+'</svg>';
  var lo=Math.min(0,Math.min.apply(null,cum)),hi=Math.max(0,Math.max.apply(null,cum));if(hi===lo)hi=lo+1;
  var Y=function(v){return 18+(hi-v)/(hi-lo)*84},X=function(j){return 40+j*52};
  var pts=cum.map(function(v,j){return X(j)+","+Y(v)}).join(" ");
  s='<svg viewBox="0 0 320 135" width="100%" role="img" aria-label="Risparmio accumulato"><line x1="20" y1="'+Y(0)+'" x2="314" y2="'+Y(0)+'" stroke="var(--bd)" stroke-dasharray="3 3"/><polyline points="'+pts+'" fill="none" stroke-width="2.5" style="stroke:var(--ac)"/>';
  cum.forEach(function(v,j){s+='<circle cx="'+X(j)+'" cy="'+Y(v)+'" r="3.5" style="fill:var(--ac)"/><text x="'+X(j)+'" y="'+(Y(v)-8)+'" font-size="9" text-anchor="middle" fill="var(--tx)">'+f0(v)+'</text><text x="'+X(j)+'" y="128" font-size="9" text-anchor="middle" fill="var(--mut)">'+lb[j]+'</text>'});
  $("chLine").innerHTML=s+'</svg>';
  var t='<table><tr><th>Mese</th><th>Risparmio</th><th>Accumulato</th></tr>';
  ks.forEach(function(k,j){t+='<tr><td>'+lb[j]+'</td><td class="'+(net[j]<0?"neg":"pos")+'">'+eur(net[j])+'</td><td>'+eur(cum[j])+'</td></tr>'});
  $("chTab").innerHTML=t+'</table>';
  var cs={},tot=0;
  items.forEach(function(x){if(x.tipo==="Spesa"&&x.data.slice(0,7)===ks[5]){cs[x.categoria]=(cs[x.categoria]||0)+x.importo;tot+=x.importo}});
  var nm=Object.keys(cs).sort(function(a,b){return cs[b]-cs[a]}),h="";
  if(!nm.length)h='<div class="lg">Nessuna spesa questo mese.</div>';
  nm.forEach(function(n){var p=cs[n]/tot*100;h+='<div class="cat"><div class="ch"><span>'+esc(n)+'</span><span>'+eur(cs[n])+' · '+Math.round(p)+'%</span></div><div class="bar"><div style="width:'+p+'%"></div></div></div>'});
  $("chCat").innerHTML=h;
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(KEY+"d",JSON.stringify(dels))}catch(e){}if(acct&&!busy)syncSoon()}
function add(x){
  x.ts=Date.now();
  if(col){col.add(x).catch(function(){say("Salvataggio non riuscito.")})}
  else{x.id="l"+Date.now()+Math.random().toString(36).slice(2,6);items.push(x);saveLocal();render()}
  say("Aggiunto: "+x.categoria+" "+eur(x.importo))
}
function remove(x){
  if(col){col.doc(x.id).delete().catch(function(){say("Eliminazione non riuscita.")})}
  else{dels.push(x.id);items=items.filter(function(i){return i.id!==x.id});saveLocal();render()}
}
$("fTipo").onchange=fillCats;
$("fAdd").onclick=function(){
  var v=parseFloat($("fImp").value);
  if(!(v>0)){say("Inserisci un importo valido.");return}
  add({data:$("fData").value||today(),tipo:$("fTipo").value,categoria:$("fCat").value,descrizione:$("fDesc").value.trim(),importo:Math.round(v*100)/100});
  $("fImp").value="";$("fDesc").value=""
};
$("qPac").onclick=function(){add({data:today(),tipo:"Investimento",categoria:"PAC",descrizione:"Versamento mensile PAC",importo:CFG.pac})};
$("qInv").onclick=function(){$("fTipo").value="Investimento";fillCats();$("fCat").value="Altro investimento";$("fImp").scrollIntoView({block:"center"});$("fImp").focus()};
$("qCasa").onclick=function(){add({data:today(),tipo:"Casa",categoria:"Accantonamento casa",descrizione:"Risparmio mensile casa",importo:CFG.casa})};
$("exp").onclick=function(){
  var lines=["Data;Tipo;Categoria;Descrizione;Importo"];
  items.slice().sort(function(a,b){return a.data<b.data?-1:1}).forEach(function(x){
    lines.push([x.data.split("-").reverse().join("/"),x.tipo,x.categoria,(x.descrizione||"").replace(/[;\n"]/g," "),String(x.importo).replace(".",",")].join(";"))});
  var u=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv"})),a=document.createElement("a");
  a.href=u;a.download="transazioni.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
};
$("fData").value=today();fillCats();
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
render();
say("Dati salvati su questo dispositivo (nel browser). Esporta il CSV ogni tanto come copia di sicurezza.");

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
/* ===== Sincronizzazione Google Foglio (Sheets API) ===== */
var G_CLIENT_ID="127530142990-cmtfkj23upho0g4rs148d2pr85qpcsn7.apps.googleusercontent.com",TAB="App_Transazioni",SCOPE="https://www.googleapis.com/auth/spreadsheets";
var dels=[],acct=false,busy=false,pushT=null,gTok=null,gExp=0,gCli=null,INTER=false;
try{dels=JSON.parse(localStorage.getItem(KEY+"d")||"[]")}catch(e){dels=[]}
$("bReset").onclick=function(){
  if(!confirm("Eliminare tutti i movimenti? Se la sincronizzazione è attiva, verranno cancellati anche dal Google Foglio. Non si può annullare."))return;
  items.forEach(function(x){dels.push(x.id)});items=[];saveLocal();render();say("Dati azzerati.");
};
function sid(){var u=localStorage.getItem(KEY+"s")||"",m=u.match(/\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:(/^[a-zA-Z0-9_-]{20,}$/.test(u)?u:"")}
function syncSoon(){clearTimeout(pushT);pushT=setTimeout(function(){runSync(false)},800)}
function token(){return new Promise(function(res,rej){
  if(gTok&&Date.now()<gExp)return res(gTok);
  if(!window.google||!google.accounts)return rej(new Error("gsi"));
  if(!gCli)gCli=google.accounts.oauth2.initTokenClient({client_id:G_CLIENT_ID,scope:SCOPE,
    callback:function(r){if(r.error)return gCli._rej(new Error(r.error));gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;gCli._res(gTok)},
    error_callback:function(e){gCli._rej(new Error(e&&e.type?e.type:"auth"))}});
  gCli._res=res;gCli._rej=rej;
  gCli.requestAccessToken({prompt:localStorage.getItem(KEY+"g")?"":"consent"});
})}
async function api(path,o){
  o=o||{};var t=await token();
  var r=await fetch("https://sheets.googleapis.com/v4/spreadsheets/"+sid()+path,{method:o.m||"GET",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:o.b?JSON.stringify(o.b):undefined});
  if(!r.ok){var e=new Error("api");e.status=r.status;throw e}
  return r.json();
}
async function runSync(inter){
  if(busy)return;
  if(!sid()){say("Incolla prima il link del Google Foglio.");return}
  var q=items.filter(function(x){return !x.sy}).length;
  if(!navigator.onLine){say("Offline: "+q+" movimenti in coda, li invierò appena torni online.");return}
  busy=true;INTER=inter;
  try{
    var meta=await api("?fields=sheets.properties.title");
    if(!meta.sheets.some(function(x){return x.properties.title===TAB})){
      await api(":batchUpdate",{m:"POST",b:{requests:[{addSheet:{properties:{title:TAB}}}]}});
      await api("/values/"+TAB+"!A1:G1?valueInputOption=RAW",{m:"PUT",b:{values:[["Data","Tipo","Categoria","Descrizione","Importo","ID","TS"]]}});
    }
    var rd=await api("/values/"+TAB+"!A2:G?valueRenderOption=UNFORMATTED_VALUE"),rows=rd.values||[],have={},clr=[];
    rows.forEach(function(r,i){
      var id=r[5];if(!id)return;have[id]=1;
      if(dels.indexOf(id)>=0){clr.push(TAB+"!A"+(i+2)+":G"+(i+2));return}
      if(!items.some(function(x){return x.id===id}))items.push({id:id,data:String(r[0]),tipo:r[1],categoria:r[2],descrizione:r[3]||"",importo:Number(r[4]),ts:Number(r[6])||0,sy:true});
    });
    if(clr.length)await api("/values:batchClear",{m:"POST",b:{ranges:clr}});
    var pend=items.filter(function(x){return !x.sy&&!have[x.id]});
    if(pend.length)await api("/values/"+TAB+"!A:G:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",{m:"POST",b:{values:pend.map(function(x){return [x.data,x.tipo,x.categoria,x.descrizione||"",x.importo,x.id,x.ts||0]})}});
    items.forEach(function(x){x.sy=true});
    localStorage.setItem(KEY+"g","1");acct=true;
    saveLocal();render();say("Sincronizzato con Google Foglio.");
  }catch(e){
    say(e.message==="gsi"?"Libreria Google non caricata (sei offline?).":"Sincronizzazione non riuscita ("+(e.status||e.message)+"). I movimenti restano in coda.");
  }
  busy=false;
}
if(G_CLIENT_ID.indexOf("INCOLLA")<0){
  $("bSync").style.display="block";
  $("bSync").onclick=function(){
    if(!sid()){
      var u=prompt("Incolla il link del tuo Google Foglio (deve essere un vero Google Fogli, non un file .xlsx):");
      if(!u)return;localStorage.setItem(KEY+"s",u);
      if(!sid()){say("Link non valido.");return}
    }
    say("Sincronizzazione in corso…");runSync(true);
  };
  window.addEventListener("online",function(){if(sid()&&localStorage.getItem(KEY+"g"))runSync(false)});
  if(sid()&&localStorage.getItem(KEY+"g")){acct=true;var n=items.filter(function(x){return !x.sy}).length;if(n)say(n+" movimenti in coda: tocca Sincronizza.")}
}
</script>
</body>
</html>
